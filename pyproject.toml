[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mucff"
version = "1.0.0"
description = "Multisource Complementary Feature Fusion for regulatory DNA prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Wentao Gong"},
  {name = "Jiaying Zhang"},
  {name = "Jingrui Li", email = "jrli@cau.edu.cn"},
  {name = "Huihui Pang"},
  {name = "Feifan Zhang", email = "feifanzhang@cau.edu.cn"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.8,<1.9",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
sources = ["torch>=2.1,<3", "transformers>=5.5,<5.6"]
figures = ["matplotlib>=3.9,<4"]
benchmark = ["xgboost>=2.1,<3", "lightgbm>=4.6,<5"]

[project.scripts]
mucff = "mucff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
