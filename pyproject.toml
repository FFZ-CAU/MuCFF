[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mucff"
version = "1.0.2"
description = "Multisource Complementary Feature Fusion for functional DNA sequence classification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Wentao Gong"},
  {name = "Jiaying Zhang"},
  {name = "Jingrui Li", email = "jrli@cau.edu.cn"},
  {name = "Huihui Pang"},
  {name = "Feifan Zhang", email = "feifanzhang@cau.edu.cn"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=3.0,<3.1",
  "scipy>=1.10,<2",
  "scikit-learn>=1.9,<2",
  "xgboost>=3.2,<3.3",
]

[project.urls]
Repository = "https://github.com/FFZ-CAU/MuCFF"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
sources = ["torch>=2.1,<3", "transformers>=5.5,<5.6"]
figures = ["matplotlib>=3.9,<4"]
benchmark = ["lightgbm>=4.6,<5"]

[project.scripts]
mucff = "mucff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
